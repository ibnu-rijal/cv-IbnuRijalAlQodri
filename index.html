  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

  <script>
    /* Terapkan tema sebelum halaman tampil agar tidak berkedip */
    try {
      var t = localStorage.getItem('theme') ||
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css">

<body>

  <header class="nav" id="nav">

    <button class="nav__toggle" id="navToggle" type="button" aria-expanded="false" aria-controls="navLinks" aria-label="Buka menu">
      <span></span><span></span><span></span>
    </button>
    <nav class="nav__links" id="navLinks" aria-label="Navigasi utama">
      <a href="#tentang">Tentang</a>

        <button class="menu__item" role="menuitem" data-dl="creative" type="button">
          <strong>CV Kreatif (PDF)</strong>
          <span>Tampilan desain, cocok untuk dilihat langsung</span>
        </button>
        <button class="menu__item" role="menuitem" data-dl="ats" type="button">

  <div id="print-root" aria-hidden="true"></div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
